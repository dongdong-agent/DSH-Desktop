[package]
name = "dsh-desktop"
version = "0.1.14"
description = "DeepSeek Harness Desktop GUI"
authors = ["Dongdong"]
edition = "2021"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 注意：不要启用 unstable（同窗口多 webview）——WebView2 多 controller 渲染
# 不稳定（实测内容区整体黑屏）。引擎页面改由主窗口顶层导航承载，见 lib.rs。
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
