[package]
name = "dsh-desktop"
version = "0.1.12"
description = "DeepSeek Harness Desktop GUI"
authors = ["Dongdong"]
edition = "2021"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable：同窗口多 webview（Window::add_child）——引擎页面的正确承载方式。
# 引擎 ≥0.1.5 的 web 端鉴权 Cookie 是 SameSite=Strict，跨站 iframe 永远拿不到，
# 必须用「顶层文档」形态的 webview 承载，见 lib.rs 的 mount_engine_view。
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "devtools", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
