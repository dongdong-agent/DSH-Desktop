<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a24"/>
      <stop offset="100%" stop-color="#0d0d12"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- 插件方块网格（一切皆插件） -->
  <g fill="none" stroke="url(#acc)" stroke-width="14">
    <rect x="96" y="96" width="140" height="140" rx="28"/>
    <rect x="276" y="96" width="140" height="140" rx="28"/>
    <rect x="96" y="276" width="140" height="140" rx="28"/>
    <rect x="276" y="276" width="140" height="140" rx="28"/>
  </g>
  <!-- 中心链路（Cordis 内核连接插件） -->
  <circle cx="166" cy="166" r="34" fill="url(#acc)"/>
  <circle cx="346" cy="346" r="34" fill="url(#acc)"/>
  <path d="M 200 166 H 276 M 166 200 V 276" stroke="url(#acc)" stroke-width="14" stroke-linecap="round"/>
  <!-- 焦点高亮 -->
  <circle cx="346" cy="166" r="22" fill="#22d3ee" opacity="0.85"/>
