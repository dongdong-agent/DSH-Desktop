<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4D6BFE"/>
      <stop offset="100%" stop-color="#2E3FBE"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- 官方 DeepSeek 几何鲸鱼（按官方 logo 像素坐标 1:1 复刻，白色） -->
  <g fill="#FFFFFF">
    <!-- 顶部两块横条 -->
    <rect x="95" y="105" width="155" height="73"/>
    <rect x="262" y="105" width="155" height="73"/>
    <!-- 中间连接块 -->
    <rect x="216" y="195" width="80" height="73"/>
    <!-- 中部两块横条（与下方竖条 L 形相连） -->
    <rect x="95" y="285" width="155" height="73"/>
    <rect x="262" y="285" width="155" height="73"/>
    <!-- 底部竖条（与中部横条相连成 L） -->
    <rect x="95" y="358" width="73" height="70"/>
    <rect x="344" y="358" width="73" height="70"/>
  </g>
</svg>
